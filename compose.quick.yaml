services:
  library:
    environment:
      BARDO_TUNNEL_URL_FILE: /tunnel/public-url
    volumes:
      - tunnel_status:/tunnel:ro
  quick-tunnel:
    build:
      context: ./tunnel
      dockerfile: Dockerfile
    image: bardo-politanense-jr/quick-tunnel:local
    volumes:
      - tunnel_status:/tunnel
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tunnel_status:
